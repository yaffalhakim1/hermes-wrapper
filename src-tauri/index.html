<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Wrapper</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d1117; color: #c9d1d9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      #app { display: flex; align-items: center; justify-content: center; height: 100%; }
      .card { max-width: 460px; text-align: center; padding: 32px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; opacity: 0.85; }
      code { background: #161b22; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="card">
        <h1>Hermes Agent</h1>
        <p>Starting local dashboard…</p>
        <p>If this message stays, the Hermes backend may not be ready yet.<br />
           The window will auto-load <code>http://127.0.0.1:9119</code> once it is available.</p>
      </div>
    </div>
  </body>
</html>
