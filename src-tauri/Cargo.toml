[package]
name = "hermes-wrapper"
version = "0.1.0"
description = "Lightweight Tauri v2 wrapper for the Hermes Agent Dashboard"
authors = ["yafi"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
